robocasa_bridge:
  ros__parameters:
    env_id: "robocasa/PickPlaceCounterToCabinet"
    seed: 0
    camera_width: 768
    camera_height: 768
    # 桥步进频率 = replan_steps / 单次推理耗时。推理约 4.5s、replan_steps=5 → 1.1Hz。
    # 推理期间 executor 会发零动作保持机器人静止,此频率只影响墙钟快慢与仿真时间利用率。
    publish_rate_hz: 1.1
    auto_reset: true
    zero_action_on_start: true
    server_host: "127.0.0.1"
    server_port: 8766
    request_timeout_sec: 300.0
    robot_id: robot0
    robot_config: nova_robot_description/config/panda_omron.yaml
    publish_robot_state: true
    publish_simulation_metrics: false
    # EEF action 反馈节流:每 N 个路径点发一次(首末必发);反馈只报进度,状态走话题。
    feedback_stride: 5
